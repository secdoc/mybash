stages: [test]

default:
  tags: ["${CI_RUNNER_TAG}"]

bash-lint-and-theme:
  stage: test
  script:
    - |
      set -euo pipefail
      IMAGE="${CI_CONTAINER_IMAGE:-docker.io/library/debian:13-slim}"
      work=$(mktemp -d)
      cleanup() {
        rm -rf "$work"
        podman image rm -f "$IMAGE" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT
      podman pull "$IMAGE"
      podman run --rm \
        -v "$CI_PROJECT_DIR:/workspace" \
        -w /workspace \
        "$IMAGE" \
        bash -c 'set -eu; apt-get update -qq; apt-get install -y --no-install-recommends bash bat shellcheck util-linux >/dev/null; find . -name "*.sh" -print0 | xargs -0 shellcheck -f gcc | tee shellcheck.log; if grep -q "error:" shellcheck.log; then exit 1; fi; bash tests/test_secdoc_theme.sh; sh tests/test_gitlab_ci_contract.sh'
  artifacts:
    when: always
    expire_in: 1 day
    paths: [shellcheck.log]
