<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<title>SECDOC dense mybash terminal theme preview</title>
<desc>Dense two-column Pop OS system information display preserving the current machine details and ASCII operating-system mark, recolored with the SECDOC brand palette.</desc>
