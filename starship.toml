format = """
[](#3B4252)\
$python\
$username\
[](bg:#434C5E fg:#3B4252)\
$directory\
[](fg:#434C5E bg:#4C566A)\
$git_branch\
$git_status\
[](fg:#4C566A bg:#86BBD8)\
$status\
$jobs\
[](fg:#86BBD8 bg:#06969A)\
$cmd_duration\
[](fg:#06969A bg:#33658A)\
$time\
[ ](fg:#33658A)\
"""
command_timeout = 5000
add_newline = false

[username]
show_always = true
style_user = "bg:#3B4252"
style_root = "bg:#3B4252"
format = '[$user ]($style)'

[directory]
style = "bg:#434C5E"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#4C566A"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#4C566A"
format = '[$all_status$ahead_behind ]($style)'

[status]
disabled = false
style = "bg:#86BBD8"
format = '[ $symbol$status ]($style)'
symbol = "✘ "
success_symbol = ""

[jobs]
disabled = false
style = "bg:#86BBD8"
format = '[ $symbol$number ]($style)'
symbol = "󰜎 "
number_threshold = 1

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "bg:#06969A"
format = '[ 󰔛 $duration ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#33658A"
format = '[ $time ]($style)'

[python]
style = "bg:#3B4252"
format = '[(\($virtualenv\) )]($style)'
